name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The publish workflow runs these same checks before it publishes.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true
      - run: vp check
      - run: vp pack
      # The rules list in README.md and each rule doc's header are generated
      # from the built plugin; fail if they no longer match it.
      - name: Generated docs are current
        run: npm run docs -- --check
      # The tarball the publish workflow would upload, without uploading it.
      - run: npm pack --dry-run

  test:
    name: test (${{ matrix.runtime }}@${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: node, version: "22" }
          - { runtime: node, version: latest }
          - { runtime: bun, version: 1.3.13 }
          - { runtime: bun, version: latest }
    env:
      # The test harness fails if the tests run on any other runtime.
      TEST_RUNTIME: ${{ matrix.runtime }}
      # `bun --bun` makes Bun the runtime of `vp` and its Vitest workers.
      VP: ${{ matrix.runtime == 'bun' && 'bun --bun vp' || 'vp' }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.runtime == 'node' && matrix.version || 'lts' }}
          cache: true
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}
      - name: Runtime
        run: ${{ matrix.runtime }} --version
      # Every rule test runs under both hosts; each step proves one of them.
      - name: Rule tests under ESLint's RuleTester
        run: $VP test -t " eslint "
      # Oxlint's RuleTester refuses to run on Bun, so this half is Node-only.
      - name: Rule tests under Oxlint's RuleTester
        if: matrix.runtime == 'node'
        run: $VP test -t " oxlint "
      # Regression tests in tests/, against the public entry only.
      - name: Regression tests
        run: $VP test tests
